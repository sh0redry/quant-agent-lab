# 评价协议 v0.2（机器可读）。与 docs/protocol.md 一一对应。
# label 取值：official（论文明确）/ unknown（论文未写）/ custom（我们自定）
version: "v0.2"
frozen_at: "2026-10-22"
supersedes: "v0.1"
official_status: false          # 非官方协议，禁止用于官方复现声明

questions:
  source: "synthetic-fixture"   # 本轮仅合成夹具
  ids: ["fc-01", "fc-02", "fc-03"]
  label: custom
  version_policy: "内容变更即升版本，并记录文件 SHA-256"

access:
  network: false                # label: custom（比官方更严）
  allowed_paths: ["data/fixtures"]
  label: custom

information_cutoff:
  required: true
  fixture_policy: "cutoff-distractor-intentional"   # 夹具可故意放入截止日后材料
  declared_in: "question.post_cutoff_material"
  measured_by: ["rubric item", "score.cutoff_compliance"]
  exposure_tracking: "normalized read paths and search hits; not proof of final-answer use"
  report_note: true
  label: custom
  official_note: "论文每题固定 cutoff；逐题清单未发布"

tools:
  names: ["read_evidence", "search_evidence", "calculate", "submit"]
  counting:
    step: "one model call"
    tool_call: "one tool invocation (retries counted separately)"
    retry: "one repeated attempt after a tool error"
  retries:
    scope: "tool error only"
    max_per_call: 1
    counted_as: "counters.retries"
  label: custom

budget:
  max_steps: 8
  max_tool_calls: 16
  max_tool_retries: 1
  timeout_seconds: 300
  timeout_enforcement:
    - "remaining time passed to provider.complete(timeout=...)"
    - "deadline checked after every model call"
    - "deadline checked before every tool call"
    - "deadline checked before and after every tool attempt, including retries"
  timeout_limit: "cooperative; in-flight tools are not forcibly interrupted, late submit is rejected"
  max_tokens: null
  max_cost_usd: null
  label: custom
  official_note: "论文只概述题目级预算，具体值未知"

termination:
  reasons: ["submitted", "max_steps", "max_tool_calls", "timeout", "error"]
  incomplete_scoring: "score 0, reported separately from wrong answers"
  label: custom

judge:
  sees: ["final_answer"]
  official_sees: ["trace", "final_answer"]
  note: "answer-only and trace-visible are different measurements; neither is strictly stricter"
  label: custom
  planned_v1: "compare answer-only vs answer+trace"

scoring:
  item_type: "binary"
  total_points: 100
  aggregate: "sum of passed item weights"
  number_parsing:
    thousands_separators: true
    parenthesised_negatives: true
    fullwidth_digits: true
    iso_dates_masked: true
    optional_metric_binding: "check.near: label immediately before value in same clause (conservative syntax)"
    optional_unit: "check.unit: allowed unit strings immediately after value; no unit conversion or period inference"
  report: ["total_score", "item_pass_rate", "completion_rate", "tool_errors", "retries", "cutoff_compliance", "usage"]
  cross_system_comparison: false
  label: custom

repeats:
  mock: 1
  real_model: 3
  human_review_min_cases: 1
  label: custom

freeze:
  record_sha256_in_run_config: true
  record_evidence_manifest: true
  forbid_same_version_edits: true
